# SP Night — Noite Paulista
# A cidade às 3h. O escuro azul-violeta do tokyodark, e o poste de sódio queimando quente por cima.
#
# Generated from the SP Night palette — do not edit by hand.
# https://github.com/sp-night/kitty
#
# install: ~/.config/kitty/sp_night_noite.conf
# enable:  include sp_night_noite.conf   (in kitty.conf, after anything else that sets colours)

background              #151723
foreground              #d3d7eb
selection_background    #272937
selection_foreground    #d3d7eb

cursor                  #f2984a
cursor_text_color       #0f101a

url_color               #6e92de

# Borders and dividers. The focused split takes the signature colour; a bell is a
# warning, so it borrows the diagnostic rather than an accent.
active_border_color     #f2984a
inactive_border_color   #373943
bell_border_color       #f5c66b

# Tabs. The active one lifts to glass, the rest stay concrete, and the bar itself
# recedes into the deepest surface.
active_tab_background   #272937
active_tab_foreground   #d3d7eb
inactive_tab_background #1d1f2d
inactive_tab_foreground #868999
tab_bar_background      #0f101a

# Marks. Three of them have to be told apart at a glance, so they differ by hue
# rather than by lightness — and every one reads dark text on a light field.
mark1_foreground        #0f101a
mark1_background        #f2984a
mark2_foreground        #0f101a
mark2_background        #b094e2
mark3_foreground        #0f101a
mark3_background        #5dbec4

# The 16 ANSI colours, normal and bright paired.
color0  #0f101a
color8  #707380
color1  #ea5d5d
color9  #ff716f
color2  #89d093
color10 #9ce4a6
color3  #f5c66b
color11 #ffdc9c
color4  #6e92de
color12 #80a5f2
color5  #b094e2
color13 #c3a7f6
color6  #5dbec4
color14 #71d1d7
color7  #868999
color15 #e7ebff
