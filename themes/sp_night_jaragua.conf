# SP Night — Pico do Jaraguá
# A mesma noite, vista do ponto mais alto da cidade. O escuro do noite girado para o verde da mata fechada — e a torre vermelha e branca acesa no topo.
#
# Generated from the SP Night palette — do not edit by hand.
# https://github.com/sp-night/kitty
#
# install: ~/.config/kitty/sp_night_jaragua.conf
# enable:  include sp_night_jaragua.conf   (in kitty.conf, after anything else that sets colours)

background              #0c100d
foreground              #d3dad5
selection_background    #202622
selection_foreground    #d3dad5

cursor                  #f2984a
cursor_text_color       #050806

url_color               #6e92de

# Borders and dividers. The focused split takes the signature colour; a bell is a
# warning, so it borrows the diagnostic rather than an accent.
active_border_color     #f2984a
inactive_border_color   #323733
bell_border_color       #f5c66b

# Tabs. The active one lifts to glass, the rest stay concrete, and the bar itself
# recedes into the deepest surface.
active_tab_background   #202622
active_tab_foreground   #d3dad5
inactive_tab_background #151a17
inactive_tab_foreground #868b87
tab_bar_background      #050806

# Marks. Three of them have to be told apart at a glance, so they differ by hue
# rather than by lightness — and every one reads dark text on a light field.
mark1_foreground        #050806
mark1_background        #f2984a
mark2_foreground        #050806
mark2_background        #b094e2
mark3_foreground        #050806
mark3_background        #60bfb8

# The 16 ANSI colours, normal and bright paired.
color0  #050806
color8  #707471
color1  #ea5d5d
color9  #ff716f
color2  #79d488
color10 #8ce99b
color3  #f5c66b
color11 #ffdc9c
color4  #6e92de
color12 #80a5f2
color5  #b094e2
color13 #c3a7f6
color6  #60bfb8
color14 #73d2cb
color7  #868b87
color15 #e7eee9
