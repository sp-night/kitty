# SP Night — Garoa
# A mesma janela, vista através do chuvisco. Cinza chapado — a garoa não esfria a cidade, ela desbota.
#
# Generated from the SP Night palette — do not edit by hand.
# https://github.com/sp-night/kitty
#
# install: ~/.config/kitty/sp_night_garoa.conf
# enable:  include sp_night_garoa.conf   (in kitty.conf, after anything else that sets colours)

background              #1c1e20
foreground              #c7cdd6
selection_background    #313436
selection_foreground    #c7cdd6

cursor                  #e3a068
cursor_text_color       #151719

url_color               #7993cb

# Borders and dividers. The focused split takes the signature colour; a bell is a
# warning, so it borrows the diagnostic rather than an accent.
active_border_color     #e3a068
inactive_border_color   #414346
bell_border_color       #e7cb8a

# Tabs. The active one lifts to glass, the rest stay concrete, and the bar itself
# recedes into the deepest surface.
active_tab_background   #313436
active_tab_foreground   #c7cdd6
inactive_tab_background #26282a
inactive_tab_foreground #8d949f
tab_bar_background      #151719

# Marks. Three of them have to be told apart at a glance, so they differ by hue
# rather than by lightness — and every one reads dark text on a light field.
mark1_foreground        #151719
mark1_background        #e3a068
mark2_foreground        #151719
mark2_background        #af97d3
mark3_foreground        #151719
mark3_background        #77babf

# The 16 ANSI colours, normal and bright paired.
